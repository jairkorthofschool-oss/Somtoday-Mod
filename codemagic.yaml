# Codemagic build configuration for Somtoday Mod iOS.
# Builds an unsigned IPA (TrollStore re-signs it on install), so no Apple
# Developer account or signing certificate is required.

workflows:
  somtoday-mod-ipa:
    name: Somtoday Mod IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      # Regenerate the mod bundle from the extension sources; on failure the
      # committed bundle in iOS/SomtodayMod/Resources is used instead.
      - name: Regenerate mod bundle
        script: python3 iOS/tools/generate_ios_bundle.py Chromium || true
      - name: Build unsigned IPA
        script: bash iOS/build_ipa.sh
    artifacts:
      - iOS/build/SomtodayMod.ipa
